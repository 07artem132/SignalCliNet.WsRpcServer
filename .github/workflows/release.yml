name: Release

# Реліз-пайплайн: publish self-contained linux-x64 + linux-arm64 + win-x64 бінарників як GitHub
# Release assets, плюс all-in-one бандли linux-{x64,arm64}-bundle (сервер + Temurin JRE 25 +
# libsignal під arch, див. deploy/bundle-linux.sh) для managed mode HA-інтеграції, і SHA256SUMS.
#
# Restore-логіка (FAST/FALLBACK) — 1:1 з build.yml (CI), плюс окремий RID-специфічний
# restore (linux-x64, win-x64) перед publish: `dotnet publish -r <rid> --self-contained`
# все одно робить власний restore, але ранній прогін тут — fail-fast + прогрів
# NuGet-кешу для конкретного RID тим самим шляхом (FAST-feed або локальний
# fallback-feed), яким пройшов generic restore вище.
# Тригери: workflow_dispatch на тег v* — основний шлях (auto-release.yml після кожного merge у main
# ставить тег і запускає цей workflow; тег від GITHUB_TOKEN `push: tags` не тригерить). Ручний push
# тегу — те саме. workflow_dispatch на гілку — лише workflow-артефакти з версією 0.0.0-manual.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1

      - name: Install .NET 10 SDK
        uses: actions/setup-dotnet@c2fa09f4bde5ebb9d1777cf28262a3eb3db3ced7 # v5.2.0
        with:
          dotnet-version: 10.0.x

      # --- FAST path: автентифікований GitHub Packages feed (джерело `github` уже в NuGet.Config) ---
      - name: Authenticate GitHub Packages feed
        env:
          NUGET_TOKEN: ${{ secrets.NUGET_READ_TOKEN || secrets.GITHUB_TOKEN }}
        run: >
          dotnet nuget update source github
          --username ${{ github.repository_owner }}
          --password "$NUGET_TOKEN"
          --store-password-in-clear-text
          --configfile NuGet.Config

      - name: Restore (GitHub Packages)
        id: restore_ghp
        continue-on-error: true
        run: dotnet restore SignalCliNet.WsRpcServer.sln

      # --- FALLBACK: build sibling-source у локальний feed (лише якщо FAST restore не вдався) ---
      - name: Checkout JSON-RPC.NET (fallback)
        if: steps.restore_ghp.outcome == 'failure'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: 07artem132/json-rpc.net
          path: _deps/JSON-RPC.NET

      - name: Checkout SignalCli.NET (fallback)
        if: steps.restore_ghp.outcome == 'failure'
        uses: actions/checkout@93cb6efe18208431cddfb8368fd83d5badbf9bfd # v5.0.1
        with:
          repository: 07artem132/signalcli.net
          path: _deps/SignalCli.NET

      - name: Build local feed + restore (fallback)
        if: steps.restore_ghp.outcome == 'failure'
        run: |
          set -euo pipefail
          JSONRPC_REPO="$PWD/_deps/JSON-RPC.NET" \
          SIGNALCLI_REPO="$PWD/_deps/SignalCli.NET" \
            bash deploy/build-local-feed.sh "$PWD/.localfeed"
          dotnet restore SignalCliNet.WsRpcServer.sln \
            --configfile deploy/nuget.ci-localfeed.config -p:NuGetAudit=false

      # --- Який шлях переміг — той самий configfile/audit-прапорець далі йде у RID-restore і publish ---
      - name: Determine restore mode
        run: |
          if [ "${{ steps.restore_ghp.outcome }}" = "success" ]; then
            echo "NUGET_EXTRA_ARGS=" >> "$GITHUB_ENV"
          else
            echo "NUGET_EXTRA_ARGS=--configfile deploy/nuget.ci-localfeed.config -p:NuGetAudit=false" >> "$GITHUB_ENV"
          fi

      # --- RID-специфічний restore: publish пізніше все одно ресторить сам, це — fail-fast + прогрів кешу ---
      - name: Restore (linux-x64, linux-arm64, win-x64)
        run: |
          set -euo pipefail
          dotnet restore SignalCliNet.WsRpcServer.sln -r linux-x64 $NUGET_EXTRA_ARGS
          dotnet restore SignalCliNet.WsRpcServer.sln -r linux-arm64 $NUGET_EXTRA_ARGS
          dotnet restore SignalCliNet.WsRpcServer.sln -r win-x64 $NUGET_EXTRA_ARGS

      # --- Build + test (реліз не публікує неперевірений код) ---
      - name: NuGet vulnerability audit gate
        run: |
          set -euo pipefail
          dotnet list SignalCliNet.WsRpcServer.sln package --vulnerable --include-transitive 2>&1 | tee audit.txt
          if grep -q "has the following vulnerable packages" audit.txt; then
            echo "::error::Знайдено вразливі NuGet-пакети — див. лог вище."
            exit 1
          fi

      - name: Build (Release)
        run: dotnet build SignalCliNet.WsRpcServer.sln -c Release --no-restore

      - name: Test (Release)
        run: >
          dotnet test tests/SignalCliNet.WsRpcServer.Tests/SignalCliNet.WsRpcServer.Tests.csproj
          -c Release --no-build

      # --- Версія релізу: з тега (push або dispatch на тег, без ведучого 'v') або заглушка для запуску з гілки ---
      - name: Determine version
        run: |
          set -euo pipefail
          if [ "${{ github.ref_type }}" = "tag" ]; then
            TAG="${GITHUB_REF#refs/tags/}"
            echo "TAG=$TAG" >> "$GITHUB_ENV"
            echo "VERSION=${TAG#v}" >> "$GITHUB_ENV"
          else
            echo "TAG=" >> "$GITHUB_ENV"
            echo "VERSION=0.0.0-manual" >> "$GITHUB_ENV"
          fi

      # --- Publish self-contained бінарників (кожен виклик сам ресторить під свій RID) ---
      - name: Publish linux-x64
        run: >
          dotnet publish src/SignalCliNet.WsRpcServer/SignalCliNet.WsRpcServer.csproj
          -c Release -r linux-x64 --self-contained true -p:PublishSingleFile=false
          -o out/linux-x64 $NUGET_EXTRA_ARGS

      - name: Publish linux-arm64
        run: >
          dotnet publish src/SignalCliNet.WsRpcServer/SignalCliNet.WsRpcServer.csproj
          -c Release -r linux-arm64 --self-contained true -p:PublishSingleFile=false
          -o out/linux-arm64 $NUGET_EXTRA_ARGS

      - name: Publish win-x64
        run: >
          dotnet publish src/SignalCliNet.WsRpcServer/SignalCliNet.WsRpcServer.csproj
          -c Release -r win-x64 --self-contained true -p:PublishSingleFile=false
          -o out/win-x64 $NUGET_EXTRA_ARGS

      - name: Archive artifacts
        run: |
          set -euo pipefail
          tar -C out/linux-x64 -czf "SignalCliNet.WsRpcServer-${VERSION}-linux-x64.tar.gz" .
          tar -C out/linux-arm64 -czf "SignalCliNet.WsRpcServer-${VERSION}-linux-arm64.tar.gz" .
          if ! command -v zip >/dev/null; then
            sudo apt-get update
            sudo apt-get install -y zip
          fi
          (cd out/win-x64 && zip -r "../../SignalCliNet.WsRpcServer-${VERSION}-win-x64.zip" .)

      # --- All-in-one бандли для managed mode HA-інтеграції (сервер + JRE 25 + libsignal під arch) ---
      - name: Build Linux bundles
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          bash deploy/bundle-linux.sh x64 out/linux-x64 "SignalCliNet.WsRpcServer-${VERSION}-linux-x64-bundle.tar.gz"
          bash deploy/bundle-linux.sh arm64 out/linux-arm64 "SignalCliNet.WsRpcServer-${VERSION}-linux-arm64-bundle.tar.gz"

      - name: Checksums
        run: sha256sum SignalCliNet.WsRpcServer-*.tar.gz SignalCliNet.WsRpcServer-*.zip | tee SHA256SUMS

      # --- Тег → справжній GitHub Release; запуск з гілки → лише workflow-артефакти (без релізу) ---
      - name: Create GitHub Release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Ідемпотентно: якщо реліз під цей тег уже створено вручну (GitHub UI → Draft a new release),
        # лише довантажуємо артефакти (--clobber), а не падаємо на "release already exists".
        run: |
          assets=(
            "SignalCliNet.WsRpcServer-${VERSION}-linux-x64.tar.gz"
            "SignalCliNet.WsRpcServer-${VERSION}-linux-arm64.tar.gz"
            "SignalCliNet.WsRpcServer-${VERSION}-linux-x64-bundle.tar.gz"
            "SignalCliNet.WsRpcServer-${VERSION}-linux-arm64-bundle.tar.gz"
            "SignalCliNet.WsRpcServer-${VERSION}-win-x64.zip"
            SHA256SUMS
          )
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" "${assets[@]}" --clobber
          else
            gh release create "$TAG" --title "SignalCliNet.WsRpcServer $VERSION" --generate-notes "${assets[@]}"
          fi

      - name: Upload workflow artifacts (manual run)
        if: github.ref_type != 'tag'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SignalCliNet.WsRpcServer-${{ env.VERSION }}
          path: |
            SignalCliNet.WsRpcServer-*.tar.gz
            SignalCliNet.WsRpcServer-*-win-x64.zip
            SHA256SUMS
