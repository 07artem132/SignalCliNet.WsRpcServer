# Reverse-proxy для docker-compose: термінує TLS (wss) АВТО-згенерованим internal-CA сертифікатом
# із тому (/data/secrets/server.crt + server.key; приватний ключ лишається 0600 — nginx-master
# читає його як root). Проксить WebSocket-upgrade на app-контейнер по внутрішній мережі.
#
# TLS 1.3 з підлогою 1.2 (старіші вимкнено) + HSTS (task 4.1). Клієнти МУСЯТЬ додати
# /data/secrets/ca.crt у свій trust-store (internal-CA path, D3/task 4.3). «Голий IP без CA»
# не підтримується — TLS без довіри до CA не валідується браузером/розширенням.
#
# За наявності ДОМЕНУ використовуйте ACME (certbot) замість цього файлу — див. nginx-wss.conf.example.

map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen 9443 ssl;
    listen [::]:9443 ssl;
    server_name _;

    ssl_certificate     /data/secrets/server.crt;
    ssl_certificate_key /data/secrets/server.key;

    # TLS 1.3 + fallback на 1.2 (floor). TLS 1.0/1.1 та SSLv3 свідомо вимкнено.
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_prefer_server_ciphers off;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305;
    ssl_session_timeout 1d;
    ssl_session_cache shared:WSRPC:10m;

    # HSTS: 2 роки, includeSubDomains. Ставимо лише тут, де трафік справді за TLS.
    add_header Strict-Transport-Security "max-age=63072000; includeSubDomains" always;

    location / {
        proxy_pass http://wsrpcserver:9000;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket-и довгоживучі — піднімаємо idle-таймаути.
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;

        # signal-cli-вкладення можуть бути великими.
        client_max_body_size 110m;
    }
}
